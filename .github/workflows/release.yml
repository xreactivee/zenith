name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not exist yet
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump the version in package.json first."
            exit 1
          fi

      - run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Zenith v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/Zenith-Setup-${{ steps.version.outputs.version }}.exe
            dist/Zenith-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
